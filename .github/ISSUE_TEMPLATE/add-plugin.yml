name: 添加应用到市场
description: 提交一个公开可访问的 DeepSeek Harness 插件或相关资源，申请收录到 DSH插件市场。
title: "[收录申请] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 DSH插件市场推荐应用。请提供完整、准确且可公开核验的信息；本站只展示插件信息和安装命令，不托管或分发插件文件。

  - type: input
    id: plugin-name
    attributes:
      label: 应用名称
      description: 填写应用或插件对外使用的正式名称。
      placeholder: 例如：dsh-example-plugin
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: GitHub 仓库地址
      description: 必须是公开且可访问的 HTTPS 仓库地址；市场将以此核验应用信息。
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: 作者或维护者
      description: 填写作者名称；如有公开主页，请一并附上链接。
      placeholder: 作者名称，https://github.com/username
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 应用简介
      description: 用简体中文说明应用解决的问题、主要用途和适用场景。
      placeholder: 请先写一句用于列表卡片的简介，再补充详细说明。
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 收录分类
      description: 选择最符合该条目的分类。
      options:
        - 工具插件（tool）
        - 帮助、文档或资源（help）
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 建议标签
      description: 使用英文标签并以英文逗号分隔，例如 Tool, Development, UI。
      placeholder: Tool, Development
    validations:
      required: true

  - type: textarea
    id: install-command
    attributes:
      label: 安装命令
      description: 填写经过验证的 DeepSeek Harness 安装命令；该命令只会作为文本展示和复制。
      placeholder: dsh plugin --profile web add github:owner/repository
      render: shell
    validations:
      required: true

  - type: input
    id: documentation
    attributes:
      label: 文档或主页
      description: 可选。填写以 https:// 开头的使用文档或项目主页。
      placeholder: https://github.com/owner/repository#readme

  - type: input
    id: license
    attributes:
      label: 开源许可证
      description: 可选。请填写仓库实际使用的许可证名称。
      placeholder: MIT

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我确认仓库公开可访问，以上信息与仓库当前内容一致。
          required: true
        - label: 我确认所有外部链接均使用 HTTPS，安装命令已经过核对。
          required: true
        - label: 我理解市场仅展示信息，不托管、分发或执行插件。
          required: true
        - label: 我已检查现有条目和 Issue，确认没有重复提交。
          required: true
